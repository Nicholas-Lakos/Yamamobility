<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030914"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="enhancements.css?v=20260927-12"><title>Yamamobility Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}.wrap{max-width:650px;margin:auto}.back{color:#38bdf8;text-decoration:none;font-weight:700}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#111827;border-radius:10px;padding:14px}.big{font-size:1.7rem;font-weight:800;color:#38bdf8}.muted{color:#94a3b8;font-size:.82rem}.exercise-search{width:100%;padding:12px;border:1px solid #475569;border-radius:9px;background:#0f172a;color:#fff;font-size:1rem}.search-results{margin-top:10px;display:grid;gap:7px}.search-result{display:block;background:#111827;border:1px solid #334155;border-radius:9px;padding:10px 12px;color:#f8fafc;text-decoration:none}.search-result small{display:block;color:#94a3b8;margin-top:3px}.mode button{background:#0f172a;border:1px solid #38bdf8;color:#38bdf8;border-radius:999px;padding:9px 12px;margin:4px;font-weight:700}.mode button.active{background:#38bdf8;color:#0f172a}</style></head><body><div class="wrap"><a class="back" href="index.html">← HOME</a><h1>Training Dashboard</h1><div class="card"><div class="grid"><div class="stat"><div class="big" id="streak">0</div><div class="muted">Day streak</div></div><div class="stat"><div class="big" id="sessions">0</div><div class="muted">Sessions completed</div></div><div class="stat"><div class="big" id="mob">0/4</div><div class="muted">Mobility this week</div></div><div class="stat"><div class="big" id="flecha">0/3</div><div class="muted">Flecha this week</div></div></div></div><div class="card mode"><h3>Pitching-Day Mode</h3><p class="muted">Choose today’s training context.</p><button data-m="Start Day">START DAY</button><button data-m="Bullpen">BULLPEN</button><button data-m="Recovery">RECOVERY</button><p id="modeText"></p></div><div class="card"><h3>Exercise Search</h3><p class="muted">Search the Yamamobility movement library.</p><input class="exercise-search" id="exerciseSearch" type="search" placeholder="Search exercises..." autocomplete="off"><div class="search-results" id="searchResults"></div></div></div><script src="enhancements.js?v=20260927-12"></script><script>const h=Yama.history(),now=Date.now(),week=h.filter(x=>now-new Date(x.day+"T00:00:00").getTime()<7*864e5);streak.textContent=Yama.streak();sessions.textContent=h.length;mob.textContent=new Set(week.filter(x=>x.type==="mobility").map(x=>x.label)).size+"/4";flecha.textContent=new Set(week.filter(x=>x.type==="flecha").map(x=>x.label)).size+"/3";const tips={"Start Day":"Keep mobility easy and dynamic. Prioritize comfortable range of motion and avoid fatiguing strength work.","Bullpen":"Use a short mobility warm-up, then your planned throwing progression. Keep extra volume low.","Recovery":"Use relaxed mobility, breathing, and low-intensity movement. Skip anything that creates pain or fatigue."};document.querySelectorAll("[data-m]").forEach(b=>{b.onclick=()=>{localStorage.setItem("yama_mode",b.dataset.m);draw()}});function draw(){let m=localStorage.getItem("yama_mode")||"Recovery";document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("active",b.dataset.m===m));modeText.textContent=tips[m]}draw();
const exerciseIndex=[
["Cat-cow","Day 1, 2, 3"],["Leg swings","Day 1, 4"],["90/90 hip switches","Day 1"],["World’s greatest stretch","Day 1"],["90/90 hip stretch","Day 1"],["Deep squat hold","Day 1"],["Low lunge with overhead reach","Day 1"],["Half-kneeling hip-flexor stretch","Day 1"],["Adductor rock-backs","Day 1"],["Pigeon pose","Day 1"],["Seated forward fold","Day 1"],["Frog stretch","Day 1"],["Wall Knee Walks","Day 1"],["Single-leg glute bridge","Day 1"],["Single-leg balance with reach","Day 1, 4"],["Half Moon","Day 1"],["Handstand","Day 1"],["Arm circles","Day 2"],["Scapular push-ups","Day 2"],["Thoracic rotations","Day 2"],["Thread the needle","Day 2"],["Wall slides","Day 2"],["Puppy pose","Day 2"],["Doorway chest stretch","Day 2"],["Quadruped thoracic rotations","Day 2"],["Cow-face arms","Day 2"],["1 Foot Handstand Push-ups","Day 2"],["Crab Touches","Day 2"],["Hand Walk Arounds","Day 2"],["Dead bug","Day 2, 4"],["1 Hand Plank Reach-Through","Day 2"],["Pelvic tilts","Day 3"],["AAROM Thoracic rotations","Day 3"],["Downward dog to plank","Day 3"],["Child’s pose with side reach","Day 3"],["Sphinx pose","Day 3"],["Open-book rotations","Day 3"],["Seated spinal rotations","Day 3"],["Low cobra","Day 3"],["Bridge pose","Day 3"],["Supported camel pose","Day 3"],["Half-split stretch","Day 3"],["Sumo Squat with OVH Reach","Day 3"],["Lying Hip over Shoulders with Rocker Reach","Day 3"],["Low lunge","Day 3"],["Supine figure-four stretch","Day 3"],["March in place","Day 4"],["Arm swings","Day 4"],["Single-leg balance with leg hold","Day 4"],["Downward dog","Day 4"],["Low lunge with rotation","Day 4"],["Warrior II","Day 4"],["Triangle pose","Day 4"],["Chair pose","Day 4"],["Bird dogs","Day 4"],["Plank Foot Crossover Reaches","Day 4"],["1-Sided Crab Holds","Day 4"],["Legs-up-the-wall","Day 4"],["Child’s pose","Day 4"],["Diaphragmatic breathing","Day 1, 2, 3, 4"]];
function searchExercises(){const q=exerciseSearch.value.trim().toLowerCase();if(!q){searchResults.innerHTML='<a class="search-result" href="movements.html">Browse all movements →</a>';return}const hits=exerciseIndex.filter(x=>x[0].toLowerCase().includes(q)).slice(0,8);searchResults.innerHTML=hits.map(x=>'<a class="search-result" href="movements.html?q='+encodeURIComponent(x[0])+'"><b>'+x[0]+'</b><small>'+x[1]+'</small></a>').join("")||'<span class="muted">No exercises found.</span>'}exerciseSearch.addEventListener("input",searchExercises);searchExercises()</script></body></html>
