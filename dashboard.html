function searchExercises(){
  const input=document.getElementById("exerciseSearch");
  const results=document.getElementById("searchResults");
  const term=input.value.trim().toLowerCase();
  if(!term){
    results.innerHTML='<a class="search-result" href="movements.html">Browse all movements →</a>';
    return;
  }
  const hits=exerciseIndex.map((x,index)=>({x,index})).filter(o=>o.x[0].toLowerCase().includes(term)).slice(0,8);
  results.innerHTML=hits.map(o=>'<button type="button" class="search-result exercise-result" data-exercise-index="'+o.index+'" style="width:100%;text-align:left;font:inherit"><b>'+o.x[0]+'</b><small>'+o.x[1]+'</small></button>').join("")||'<span class="muted">No exercises found.</span>';
}
function openExercise(i){
  const x=exerciseIndex[Number(i)];
  if(!x)return;
  const modal=document.getElementById("exerciseModal");
  const name=document.getElementById("exerciseModalName");
  const day=document.getElementById("exerciseModalDay");
  const img=document.getElementById("exerciseModalImage");
  name.textContent=x[0];
  day.textContent=x[1];document.getElementById("exerciseModalRx").textContent=exerciseRx[x[0]]||"";const det=exerciseDetails[x[0]]||["Perform the movement slowly through a comfortable range with control.","COACHING CUE: Keep the movement smooth and stop for sharp pain, pinching, numbness, or tingling."];document.getElementById("exerciseModalDescription").textContent=det[0];document.getElementById("exerciseModalCue").textContent=(det[1].startsWith("COACHING CUE:")?"":"COACHING CUE: ")+det[1];
  const src=exerciseImages[x[0]];
  img.innerHTML=src?'<img src="'+src+'" alt="'+x[0].replace(/"/g,"&quot;")+'">':'<div class="no-image">Image not added yet.</div>';

}
