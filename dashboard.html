<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030914"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="enhancements.css"><title>Yamamobility Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}.wrap{max-width:650px;margin:auto}.back{color:#38bdf8;text-decoration:none;font-weight:700}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#111827;border-radius:10px;padding:14px}.big{font-size:1.7rem;font-weight:800;color:#38bdf8}.muted{color:#94a3b8;font-size:.82rem}.history{line-height:1.8}.mode button{background:#0f172a;border:1px solid #38bdf8;color:#38bdf8;border-radius:999px;padding:9px 12px;margin:4px;font-weight:700}.mode button.active{background:#38bdf8;color:#0f172a}</style></head><body><div class="wrap"><a class="back" href="index.html">← HOME</a><h1>Training Dashboard</h1><div class="card"><div class="grid"><div class="stat"><div class="big" id="streak">0</div><div class="muted">Day streak</div></div><div class="stat"><div class="big" id="sessions">0</div><div class="muted">Sessions completed</div></div><div class="stat"><div class="big" id="mob">0/4</div><div class="muted">Mobility this week</div></div><div class="stat"><div class="big" id="flecha">0/3</div><div class="muted">Flecha this week</div></div></div></div><div class="card mode"><h3>Pitching-Day Mode</h3><p class="muted">Choose today’s training context.</p><button data-m="Start Day">START DAY</button><button data-m="Bullpen">BULLPEN</button><button data-m="Recovery">RECOVERY</button><p id="modeText"></p></div><div class="card"><h3>Recent Training</h3><div class="history" id="history"></div></div></div><script src="enhancements.js"></script><script>const h=Yama.history(),now=Date.now(),week=h.filter(x=>now-new Date(x.day+"T00:00:00").getTime()<7*864e5);streak.textContent=Yama.streak();sessions.textContent=h.length;mob.textContent=new Set(week.filter(x=>x.type==="mobility").map(x=>x.label)).size+"/4";flecha.textContent=new Set(week.filter(x=>x.type==="flecha").map(x=>x.label)).size+"/3";history.innerHTML=h.slice(-12).reverse().map(x=>"<div>"+x.day+" — "+x.label+"</div>").join("")||'<span class="muted">Complete a workout to start your history.</span>';const tips={"Start Day":"Keep mobility easy and dynamic. Prioritize comfortable range of motion and avoid fatiguing strength work.","Bullpen":"Use a short mobility warm-up, then your planned throwing progression. Keep extra volume low.","Recovery":"Use relaxed mobility, breathing, and low-intensity movement. Skip anything that creates pain or fatigue."};document.querySelectorAll("[data-m]").forEach(b=>{b.onclick=()=>{localStorage.setItem("yama_mode",b.dataset.m);draw()}});function draw(){let m=localStorage.getItem("yama_mode")||"Recovery";document.querySelectorAll("[data-m]").forEach(b=>b.classList.toggle("active",b.dataset.m===m));modeText.textContent=tips[m]}draw()</script></body></html>
