<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030914"><title>Yamamobility Calendar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}.wrap{max-width:650px;margin:auto}.back{color:#38bdf8;text-decoration:none;font-weight:800}h1{margin:18px 0 12px}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin:14px 0}.muted{color:#94a3b8;font-size:.82rem}.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.cal-head button{border:1px solid #38bdf8;background:#0f172a;color:#fff;border-radius:8px;width:40px;height:40px;font-size:1.25rem}.month{font-weight:900;text-align:center;font-size:1.05rem}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week{margin:14px 0 5px;color:#94a3b8;font-size:.65rem;text-align:center;font-weight:900}.day{position:relative;min-width:0;min-height:70px;border:1px solid #334155;border-radius:8px;background:#fff;color:#0f172a;padding:5px 2px;text-align:center;font:inherit;overflow:hidden}.day.empty{visibility:hidden}.day.today{border:2px solid #38bdf8}.day.has{background:#fff}.day .num{color:rgb(0,0,156)}.day.both-done{background:rgb(0,0,156);color:#fff}.day.both-done .num{color:#fff}.day.mobility-only{background:linear-gradient(to bottom,rgb(0,0,156) 0%,rgb(0,0,156) 60%,#fff 60%,#fff 100%);color:#0f172a}.day.mobility-only .num{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.65)}.day.flecha-only{background:linear-gradient(to bottom,#fff 0%,#fff 60%,rgb(0,0,156) 60%,rgb(0,0,156) 100%);color:#0f172a}.day.flecha-only .num{color:rgb(0,0,156);text-shadow:none}.day.both-done .type{color:#fff}.day.mobility-only .type{color:rgb(0,0,156)}.day.flecha-only .type{color:#fff}.num{display:block;font-size:.76rem;font-weight:900}.type{position:absolute;left:2px;right:2px;top:27px;display:block;font-size:.5rem;color:rgb(0,0,156);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.check{display:block;margin-top:4px;font-size:.48rem;color:#a7f3d0;font-weight:900}.editor{display:none;margin-top:16px;border-top:1px solid #334155;padding-top:14px}.editor.open{display:block}.date-label{display:block;font-size:1rem;margin-bottom:10px}.readiness{padding:11px;border:1px solid #334155;border-radius:10px;background:#111827;margin-bottom:14px}.readiness h3{margin:0 0 8px;color:#38bdf8;font-size:.9rem}.ready-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.ready-item{background:#0f172a;border-radius:7px;padding:8px;font-size:.78rem}.ready-item span{display:block;color:#94a3b8;font-size:.65rem;margin-bottom:2px}.ready-item b{color:#fff}.wide{grid-column:1/-1}.completion-boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.completion-box{display:flex!important;align-items:center;gap:9px;margin:0!important;padding:10px;background:#111827;border:1px solid #334155;border-radius:9px;color:#fff!important;font-size:.78rem!important}.completion-box input{width:20px!important;height:20px;accent-color:#22c55e}.edit-btn,.save-ready{width:100%;margin-top:9px;border:1px solid #38bdf8;border-radius:8px;padding:10px;font-weight:900}.edit-btn{background:#0c315f;color:#fff}.save-ready{background:#38bdf8;color:#0f172a}.ready-edit{display:none;margin-top:10px}.ready-edit.open{display:block}.scale{margin:10px 0}.scale-top{display:flex;justify-content:space-between;font-size:.78rem;font-weight:800}.scale output{color:#38bdf8}.scale input{width:100%;accent-color:#38bdf8}.editor label{display:block;color:#94a3b8;font-size:.78rem;font-weight:800;margin:10px 0 5px}.editor select,.editor input[type=text],.editor textarea,.ready-edit input[type=text]{width:100%;border:1px solid #475569;border-radius:9px;background:#0f172a;color:#fff;padding:11px;font-size:1rem}.editor textarea{min-height:72px;resize:vertical}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:1px solid #38bdf8;border-radius:9px;padding:10px;background:#0f172a;color:#fff;font-weight:900}.actions .save{background:#38bdf8;color:#0f172a}.actions .save.hidden{display:none}@media(max-width:430px){body{padding:10px}.card{padding:12px}.week,.grid{gap:3px}.day{min-height:66px}.type{font-size:.47rem}.check{font-size:.44rem}}
</style></head><body><div class="wrap"><a class="back" href="index.html">← HOME</a><h1>Throwing Calendar</h1><div class="card">
<div class="cal-head"><div class="month" id="month"></div></div>
<p class="muted">Tap any day to view or edit throwing and check-in information.</p>
<div class="week"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div><div class="grid" id="grid"></div>
<div class="editor" id="editor"><strong class="date-label" id="dateLabel"></strong>
<div class="readiness"><h3>CHECK-IN</h3><div class="ready-grid" id="readyGrid"></div><button class="edit-btn" id="editReady" type="button">ADD CHECK-IN</button>
<div class="ready-edit" id="readyEdit"><div id="scales"></div><label>Recovery</label><input id="recovery" type="text" placeholder="Example: 82%"><label>Sleep</label><input id="sleep" type="text" placeholder="Example: 91% or Good"><label>Sleep Time</label><input id="sleepTime" type="text" placeholder="Example: 8h 12m"><button class="save-ready" id="saveReady" type="button">SAVE CHECK-IN</button></div></div>
<div class="completion-boxes"><label class="completion-box"><input id="mobilityDone" type="checkbox"><span>Mobility Complete</span></label><label class="completion-box"><input id="flechaDone" type="checkbox"><span>Flecha Complete</span></label></div><label>Throwing type</label><select id="type"><option value="">Not reported</option><option>Catch</option><option>Bullpen</option><option>Start</option><option>Recovery Throw</option><option>High-Intensity Throwing</option><option>Flecha</option><option>Off Day</option><option>Other</option></select>
<label>Intensity / effort</label><input id="intensity" type="text" placeholder="Example: 70% or easy"><label>Notes</label><textarea id="notes" placeholder="Pitch count, distance, focus, how you felt..."></textarea>
<div class="actions"><button id="del" type="button">DELETE DAY</button><button class="save" id="save" type="button">SAVE THROWING</button></div></div>
</div></div>
<script>
const KEY="yama_throwing_calendar";let view=new Date(),selected="",throwBaseline="";
const $=id=>document.getElementById(id);
function data(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}}
function put(d){localStorage.setItem(KEY,JSON.stringify(d))}
function key(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hasReady(r){return !!r&&Object.values(r).some(v=>v!==""&&v!=null)}function history(){try{return JSON.parse(localStorage.getItem("yamamobility_history")||"[]")}catch(e){return[]}}function completion(k,type){const x=data()[k]||{},manual=x.completions&&x.completions[type];if(manual!==undefined)return !!manual;return history().some(x=>x.day===k&&x.type===type)}function saveCompletion(type,checked){if(!selected)return;const d=data(),old=d[selected]||{},c={...(old.completions||{})};c[type]=checked;d[selected]={...old,completions:c};put(d);render()}
function render(){const all=data(),now=new Date(),day=now.getDay(),offset=day===0?-6:1-day,monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()+offset),sunday=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+6),tk=key(now.getFullYear(),now.getMonth(),now.getDate());$("month").textContent=monday.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" – "+sunday.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});let h="";for(let i=0;i<7;i++){const dt=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i),k=key(dt.getFullYear(),dt.getMonth(),dt.getDate()),x=all[k]||{},ready=hasReady(x.readiness),mob=completion(k,"mobility"),fle=completion(k,"flecha"),doneClass=mob&&fle?"both-done":mob?"mobility-only":fle?"flecha-only":"",has=x.type||ready||x.intensity||x.notes||(x.completions&&Object.values(x.completions).some(Boolean));h+='<button type="button" class="day '+(has?"has ":"")+doneClass+" "+(k===tk?"today":"")+'" data-date="'+k+'"><span class="num">'+dt.getDate()+'</span>'+(x.type?'<span class="type">'+esc(x.type)+'</span>':'')+'</button>'}$("grid").innerHTML=h}
function readyDisplay(r){r=r||{};const vals=[["Arm",r.arm,true],["Body",r.body,true],["Energy",r.energy,true],["Soreness",r.soreness,true],["Recovery",r.recovery],["Sleep",r.sleep],["Sleep Time",r.sleepTime]];$("readyGrid").innerHTML=vals.map(v=>'<div class="ready-item '+(v[0]==="Sleep Time"?"wide":"")+'"><span>'+v[0]+'</span><b>'+(v[1]!==undefined&&v[1]!==""?esc(v[1])+(v[2]?"/10":""):"—")+'</b></div>').join("");$("editReady").textContent=hasReady(r)?"EDIT CHECK-IN":"ADD CHECK-IN"}
function openDay(k){selected=k;const x=data()[k]||{};$("dateLabel").textContent=new Date(k+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});$("type").value=x.type||"";$("intensity").value=x.intensity||"";$("notes").value=x.notes||"";throwBaseline=JSON.stringify({type:$("type").value,intensity:$("intensity").value,notes:$("notes").value});updateThrowSave();readyDisplay(x.readiness);$("mobilityDone").checked=completion(k,"mobility");$("flechaDone").checked=completion(k,"flecha");$("readyEdit").classList.remove("open");$("del").style.visibility=(x.type||hasReady(x.readiness)||x.intensity||x.notes)?"visible":"hidden";$("editor").classList.add("open");$("editor").scrollIntoView({behavior:"smooth",block:"nearest"})}
function buildReady(){const r=(data()[selected]||{}).readiness||{},defs=[["arm","Arm"],["body","Body"],["energy","Energy"],["soreness","Soreness"]];$("scales").innerHTML=defs.map(([id,label])=>{const v=Number(r[id])||5;return '<div class="scale"><div class="scale-top"><span>'+label+'</span><output id="'+id+'Out">'+v+'</output></div><input id="'+id+'" type="range" min="0" max="10" value="'+v+'"></div>'}).join("");defs.forEach(([id])=>{$(id).oninput=()=>$(id+"Out").textContent=$(id).value});$("recovery").value=r.recovery||"";$("sleep").value=r.sleep||"";$("sleepTime").value=r.sleepTime||"";$("readyEdit").classList.add("open")}
$("grid").addEventListener("click",e=>{const b=e.target.closest("[data-date]");if(b)openDay(b.dataset.date)});
$("mobilityDone").onchange=()=>saveCompletion("mobility",$("mobilityDone").checked);$("flechaDone").onchange=()=>saveCompletion("flecha",$("flechaDone").checked);function updateThrowSave(){const now=JSON.stringify({type:$("type").value,intensity:$("intensity").value,notes:$("notes").value});$("save").classList.toggle("hidden",now===throwBaseline)}["type","intensity","notes"].forEach(id=>$(id).addEventListener(id==="type"?"change":"input",updateThrowSave));$("editReady").onclick=buildReady;
$("saveReady").onclick=()=>{if(!selected)return;const d=data(),old=d[selected]||{};d[selected]={...old,readiness:{arm:Number($("arm").value),body:Number($("body").value),energy:Number($("energy").value),soreness:Number($("soreness").value),recovery:$("recovery").value.trim(),sleep:$("sleep").value.trim(),sleepTime:$("sleepTime").value.trim()}};put(d);openDay(selected);render()};
$("save").onclick=()=>{if(!selected)return;const d=data(),old=d[selected]||{};d[selected]={...old,type:$("type").value,intensity:$("intensity").value.trim(),notes:$("notes").value.trim()};put(d);throwBaseline=JSON.stringify({type:$("type").value,intensity:$("intensity").value,notes:$("notes").value});$("editor").classList.remove("open");render()};
$("del").onclick=()=>{if(!selected)return;const d=data();delete d[selected];put(d);$("editor").classList.remove("open");render()};
render();const today=new Date(),todayKey=key(today.getFullYear(),today.getMonth(),today.getDate());openDay(todayKey);
</script></body></html>
