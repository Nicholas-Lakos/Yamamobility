lor:#cbd5e1;font-size:.8rem}.ready-score b{color:#38bdf8}</style></head><body><div class="wrap"><a class="back" href="index.html">← HOME</a><h1>Throwing Calendar</h1><div class="card"><div class="throw-cal-head"><button type="button" id="throwPrev" aria-label="Previous month">‹</button><div><h3 style="margin:0;text-align:center">Calendar</h3><div class="throw-month" id="throwMonth"></div></div><button type="button" id="throwNext" aria-label="Next month">›</button></div><p class="muted">Tap a day to add or edit your throwing plan.</p><div class="throw-week"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div><div class="throw-grid" id="throwGrid"></div><div class="throw-editor" id="throwEditor"><strong id="throwDateLabel"></strong><div class="day-readiness" id="dayReadiness"><h4>CHECK-IN</h4><div class="day-ready-grid" id="dayReadinessGrid"></div><button type="button" class="edit-checkin" id="editCheckin">EDIT CHECK-IN</button><div class="ready-edit" id="readyEdit"><div id="readyScaleFields"></div><label for="editRecovery">Recovery</label><input type="text" id="editRecovery"><label for="editSleep">Sleep</label><input type="text" id="editSleep"><label for="editSleepTime">Sleep Time</label><input type="text" id="editSleepTime"><button type="button" class="ready-edit-save" id="saveCheckin">SAVE CHECK-IN</button></div></div><label for="throwType">Throwing type</label><select id="throwType"><option>Catch</option><option>Bullpen</option><option>Start</option><option>Recovery Throw</option><option>High-Intensity Throwing</option><option>Flecha</option><option>Off Day</option><option>Other</option></select><label for="throwIntensity">Intensity / effort</label><input id="throwIntensity" type="text" placeholder="Example: 70% or easy"><label for="throwNotes">Notes</label><textarea id="throwNotes" placeholder="Pitch count, distance, focus, how you felt..."></textarea><div class="throw-actions"><button type="button" id="throwDelete">DELETE</button><button type="button" class="save" id="throwSave">SAVE</button></div></div></div></div><script>const THROW_KEY="yama_throwing_calendar";let throwView=new Date(),throwSelected="";function throwData(){try{return JSON.parse(localStorage.getItem(THROW_KEY)||"{}")}catch(e){return{}}}function saveThrowData(d){localStorage.setItem(THROW_KEY,JSON.stringify(d))}function dateKey(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}function renderThrowCalendar(){const y=throwView.getFullYear(),m=throwView.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),data=throwData(),today=new Date(),todayKey=dateKey(today.getFullYear(),today.getMonth(),today.getDate());document.getElementById("throwMonth").textContent=new Date(y,m,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});let html="";for(let i=0;i<first;i++)html+='<button class="throw-day empty" tabindex="-1"></button>';for(let d=1;d<=days;d++){const k=dateKey(y,m,d),x=data[k];html+='<button type="button" class="throw-day '+(x?"has ":"")+(k===todayKey?"today":"")+'" data-throw-date="'+k+'"><span class="num">'+d+'</span>'+(x&&x.type?'<span class="type">'+escapeThrow(x.type)+'</span>':"")+(x&&x.readiness?'<span class="ready-dot">CHECK-IN ✓</span>':"")+'</button>'}document.getElementById("throwGrid").innerHTML=html}function escapeThrow(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function openThrowEditor(k){throwSelected=k;const x=throwData()[k]||{};document.getElementById("throwDateLabel").textContent=new Date(k+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});document.getElementById("throwType").value=x.type||"Catch";document.getElementById("throwIntensity").value=x.intensity||"";document.getElementById("throwNotes").value=x.notes||"";const rr=x.readiness||{},box=document.getElementById("dayReadiness"),grid=document.getElementById("dayReadinessGrid");const vals=[["Arm",rr.arm],["Body",rr.body],["Energy",rr.energy],["Soreness",rr.soreness],["Recovery",rr.recovery],["Sleep",rr.sleep],["Sleep Time",rr.sleepTime]];if(Object.values(rr).some(v=>v!==""&&v!=null)){grid.innerHTML=vals.map(v=>'<div class="day-ready-item '+(v[0]==="Sleep Time"?"day-ready-wide":"")+'"><span>'+v[0]+'</span><b>'+escapeThrow(v[1]!==undefined&&v[1]!==""?v[1]:"—")+(["Arm","Body","Energy","Soreness"].includes(v[0])&&v[1]!==undefined&&v[1]!==""?"/10":"")+'</b></div>').join("");box.classList.add("show");document.getElementById("editCheckin").textContent="EDIT CHECK-IN"}else{grid.innerHTML="";box.classList.add("show");document.getElementById("editCheckin").textContent="ADD CHECK-IN"}document.getElementById("readyEdit").classList.remove("open")document.getElementById("throwDelete").style.visibility=x.type?"visible":"hidden";document.getElementById("throwEditor").classList.add("open")}function buildReadyEdit(){const d=throwData(),r=(d[throwSelected]&&d[throwSelected].readiness)||{};const defs=[["arm","Arm"],["body","Body"],["energy","Energy"],["soreness","Soreness"]];document.getElementById("readyScaleFields").innerHTML=defs.map(([id,label])=>{const v=Number(r[id])||5;return '<div class="scale-row"><div class="scale-top"><span>'+label+'</span><output id="edit_'+id+'_out">'+v+'</output></div><input type="range" min="1" max="10" value="'+v+'" id="edit_'+id+'"></div>'}).join("");defs.forEach(([id])=>{const el=document.getElementById("edit_"+id),out=document.getElementById("edit_"+id+"_out");el.oninput=()=>out.textContent=el.value});document.getElementById("editRecovery").value=r.recovery||"";document.getElementById("editSleep").value=r.sleep||"";document.getElementById("editSleepTime").value=r.sleepTime||"";document.getElementById("readyEdit").classList.add("open")}document.getElementById("editCheckin").onclick=buildReadyEdit;document.getElementById("saveCheckin").onclick=()=>{if(!throwSelected)return;const d=throwData(),old=d[throwSelected]||{};d[throwSelected]={...old,readiness:{arm:Number(document.getElementById("edit_arm").value),body:Number(document.getElementById("edit_body").value),energy:Number(document.getElementById("edit_energy").value),soreness:Number(document.getElementById("edit_soreness").value),recovery:document.getElementById("editRecovery").value.trim(),sleep:document.getElementById("editSleep").value.trim(),sleepTime:document.getElementById("editSleepTime").value.trim()}};saveThrowData(d);openThrowEditor(throwSelected);renderThrowCalendar()};document.getElementById("throwGrid").addEventListener("click",e=>{const b=e.target.closest("[data-throw-date]");if(b)openThrowEditor(b.dataset.throwDate)});document.getElementById("throwPrev").onclick=()=>{throwView=new Date(throwView.getFullYear(),throwView.getMonth()-1,1);renderThrowCalendar()};document.getElementById("throwNext").onclick=()=>{throwView=new Date(throwView.getFullYear(),throwView.getMonth()+1,1);renderThrowCalendar()};document.getElementById("throwSave").onclick=()=>{if(!throwSelected)return;const d=throwData();d[throwSelected]={type:document.getElementById("throwType").value,intensity:document.getElementById("throwIntensity").value.trim(),notes:document.getElementById("throwNotes").value.trim(),readiness:(d[throwSelected]&&d[throwSelected].readiness)||{}};saveThrowData(d);document.getElementById("throwEditor").classList.remove("open");renderThrowCalendar()};document.getElementById("throwDelete").onclick=()=>{if(!throwSelected)return;const d=throwData();delete d[throwSelected];saveThrowData(d);document.getElementById("throwEditor").classList.remove("open");renderThrowCalendar()};renderThrowCalendar();</script></body></html>
