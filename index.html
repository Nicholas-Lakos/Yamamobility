<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pitcher Mobility Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --active-item-bg: rgba(34, 197, 94, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 650px; }
    header { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: .85rem; color: var(--text-muted); margin-bottom: 14px; line-height: 1.3; }
    .main-progress { background-color: #0f172a; border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--card-border); }
    .progress-text { font-size: .9rem; font-weight: 600; color: var(--accent-blue); }
    .btn-reset { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 6px 12px; border-radius: 6px; font-size: .8rem; font-weight: 600; cursor: pointer; touch-action: manipulation; }
    .btn-reset:active { background: #ef4444; color: #fff; }
    .day-accordion { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .day-header { width: 100%; background: none; border: none; padding: 14px 16px; text-align: left; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; touch-action: manipulation; }
    .day-title-container { display: flex; align-items: center; gap: 12px; cursor: pointer; flex-grow: 1; }
    .day-title { font-size: 1rem; font-weight: 600; line-height: 1.2; }
    .day-meta { display: flex; align-items: center; gap: 10px; padding-left: 8px; cursor: pointer; }
    .day-counter { font-size: .85rem; font-weight: 600; color: var(--accent-blue); white-space: nowrap; }
    .arrow { transition: transform .3s ease; font-size: .75rem; color: var(--text-muted); }
    .day-accordion.active .arrow { transform: rotate(180deg); }
    .day-description { padding: 0 16px 12px; font-size: .8rem; color: var(--text-muted); border-bottom: 1px solid var(--card-border); line-height: 1.35; }
    .day-content { max-height: 0; overflow: hidden; transition: max-height .3s ease-out; background: #111827; }
    .day-accordion.active .day-content { max-height: 2500px; transition: max-height .4s ease-in; }
    input[type="checkbox"] { appearance: none; width: 22px; height: 22px; border: 2px solid var(--text-muted); border-radius: 6px; outline: none; cursor: pointer; position: relative; flex-shrink: 0; }
    input[type="checkbox"]:checked { background: var(--accent-green); border-color: var(--accent-green); }
    input[type="checkbox"]:checked::after { content: '✓'; position: absolute; color: white; font-size: 15px; font-weight: bold; top: -2px; left: 4px; }
    .section-title { font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-blue); padding: 10px 16px 4px; background: #172033; border-top: 1px solid var(--card-border); font-weight: 700; }
    .exercise-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #1f2937; cursor: pointer; user-select: none; transition: background-color .15s ease; }
    .exercise-item:last-child { border-bottom: none; }
    .exercise-item input[type="checkbox"] { margin-right: 14px; }
    .exercise-label { font-size: .9rem; color: var(--text-main); flex-grow: 1; line-height: 1.3; }
    .exercise-item:has(input[type="checkbox"]:checked) { background: var(--active-item-bg); }
    .exercise-item input[type="checkbox"]:checked + .exercise-label { color: var(--text-main); font-weight: 500; }
    .exercise-item { cursor: pointer; } .movement-icon { margin-left:8px;color:var(--accent-blue);font-size:.75rem;opacity:.8; } .movement-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(4px)} .movement-modal.open{display:flex}.movement-card{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.45)} .movement-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px 10px}.movement-title{font-size:1.05rem;font-weight:700;line-height:1.25}.movement-close{border:1px solid var(--card-border);background:transparent;color:var(--text-main);width:34px;height:34px;border-radius:50%;font-size:1.2rem;cursor:pointer}.movement-visual{margin:0 18px;min-height:250px;border-radius:12px;background:#0b1220;border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;overflow:hidden}.movement-visual svg{width:100%;height:250px}.movement-details{padding:14px 18px 18px}.movement-details p{color:var(--text-muted);font-size:.88rem;line-height:1.45;margin-bottom:10px}.movement-tip{color:var(--text-main)!important}
    .day-note { padding: 12px 16px; font-size: .8rem; color: #f59e0b; background: #271e11; border-top: 1px solid var(--card-border); font-style: italic; line-height: 1.35; }
  </style>
</head>
<body>
<div class="app-container">
  <header>
    <h1>Pitcher Mobility</h1>
    <div class="subtitle">4-Day Yoga &amp; Mobility (Flexibility, body control, functional strength, recovery)</div>
    <div class="main-progress">
      <span class="progress-text" id="total-progress">0 of 70 exercises complete</span>
      <button class="btn-reset" onclick="resetAll()">Reset</button>
    </div>
  </header>
  <div id="routine-container"></div><div class="movement-modal" id="movement-modal" role="dialog" aria-modal="true"><div class="movement-card" onclick="event.stopPropagation()"><div class="movement-head"><div class="movement-title" id="movement-title">Movement</div><button class="movement-close" onclick="closeMovement()">×</button></div><div class="movement-visual" id="movement-visual"></div><div class="movement-details"><p id="movement-description"></p><p class="movement-tip" id="movement-tip"></p></div></div></div>
</div>
<script>
const workoutData = [
  {day:1,title:"DAY 1 — Lower-body & hip mobility",description:"Improve hip rotation, hip extension, hamstring flexibility, and lower-body control.",sections:[
    {name:"Warm-up",exercises:["Cat-cow — 10 reps","Leg swings, front to back — 10 per leg","90/90 hip switches — 10 total","World’s greatest stretch — 5 per side"]},
    {name:"Mobility Flow",exercises:["90/90 hip stretch — 2 × 45 sec per side","Deep squat hold — 2 × 45 sec","Low lunge with overhead reach — 2 × 30 sec per side","Half-kneeling hip-flexor stretch — 2 × 45 sec per side","Adductor rock-backs — 2 × 10 per side"]},
    {name:"Yoga & Flexibility",exercises:["Pigeon pose — 2 × 45 sec per side","Seated forward fold — 2 × 45 sec","Frog stretch — 2 × 30 sec"]},
    {name:"Strength & Control",exercises:["Wall Knee Walks — 2 × 8","Single-leg glute bridge — 2 × 10 per side","Single-leg balance with reach — 2 × 5 per side","Half Moon — 2 × 30 sec per side","Handstand — 2 × Fail"]}]},
  {day:2,title:"DAY 2 — Shoulder, chest & upper-back mobility",description:"Maintain comfortable shoulder movement, thoracic extension/rotation, and shoulder-blade control.",note:"Keep this session easy before a bullpen or start. Skip any movement that causes shoulder discomfort.",sections:[
    {name:"Warm-up",exercises:["Arm circles — 10 each direction","Scapular push-ups — 10 reps","Cat-cow — 10 reps","Thoracic rotations — 8 per side"]},
    {name:"Mobility Flow",exercises:["Thread the needle — 2 × 8 per side","Wall slides — 2 × 10","Puppy pose — 2 × 30 sec","Doorway chest stretch — 2 × 30 sec per side","Quadruped thoracic rotations — 2 × 8 per side"]},
    {name:"Yoga & Flexibility",exercises:["Puppy pose — 2 × 30–45 sec","Cow-face arms — 2 × 20–30 sec per side","Thread the needle — 2 × 30 sec per side"]},
    {name:"Strength & Control",exercises:["1 Foot Handstand Push-ups — 2 × 5 per side","Crab Touches — 2 × 3","Hand Walk Arounds — 2 × 5 per side","Dead bug — 2 × 8 per side","1 Hand Plank Reach-Through — 2 × 5 per side"]}]},
  {day:3,title:"DAY 3 — Spinal flexibility & deep stretching",description:"Improve thoracic extension, spinal control, hamstring flexibility, and gradual backbend capacity.",note:"Focus on controlled extension through the upper back and hips. Do not force extreme lumbar backbends or jump straight into full wheel pose.",sections:[
    {name:"Warm-up",exercises:["Cat-cow — 10 reps","Pelvic tilts — 10 reps","AAROM Thoracic rotations — 8 per side","Downward dog to plank — 8 reps"]},
    {name:"Mobility Flow",exercises:["Child’s pose with side reach — 2 × 30 sec per side","Sphinx pose — 2 × 30 sec","Open-book rotations — 2 × 8 per side","Seated spinal rotations — 2 × 8 per side"]},
    {name:"Yoga & Flexibility",exercises:["Sphinx pose — 2 × 30–45 sec","Low cobra — 2 × 8 reps, holding 5 sec","Bridge pose — 2 × 5 reps, holding 5 sec","Supported camel pose — 2 × 20 sec"]},
    {name:"Strength & Control",exercises:["Half-split stretch — 2 × 45 sec per side","Sumo Squat with OVH Reach — 2 × 10","Lying Hip over Shoulders with Rocker Reach — 2 × 45 sec","Low lunge — 1 × 45 sec per side","Supine figure-four stretch — 1 × 45 sec per side"]}]},
  {day:4,title:"DAY 4 — Full-body flow & pitcher-specific control",description:"Connect mobility, balance, breathing, and strength into a smooth full-body session.",note:"Train to mild tension, not pain. Stop for sharp pain, numbness, tingling, or pinching.",sections:[
    {name:"Warm-up",exercises:["March in place — 1 min","Arm swings — 10 each direction","Leg swings — 10 per leg","Cat-cow — 8 reps"]},
    {name:"Mobility Flow — 2 relaxed rounds",exercises:["Single-leg balance with leg hold — 2 × 20 sec per leg","Downward dog — 30 sec","Low lunge with rotation — 5 per side","Warrior II — 30 sec per side","Triangle pose — 30 sec per side","Chair pose — 30 sec","Child’s pose — 30 sec"]},
    {name:"Strength & Control",exercises:["Single-leg balance with reach — 2 × 5 per side","Bird dogs — 2 × 8 per side","Dead bugs — 2 × 8 per side","Plank Foot Crossover Reaches — 2 × 5 per side","1-Sided Crab Holds — 2 × 30 sec per side"]},
    {name:"Finish",exercises:["Legs-up-the-wall — 2 min","Child’s pose — 1 min","Diaphragmatic breathing — 2 min"]}]}
];

let globalExerciseCount=0;
function renderApp(){
  const container=document.getElementById('routine-container'); container.innerHTML=''; globalExerciseCount=0;
  workoutData.forEach(dayData=>{
    let dayTotal=dayData.sections.reduce((sum,s)=>sum+s.exercises.length,0); globalExerciseCount+=dayTotal;
    const dayEl=document.createElement('div'); dayEl.className='day-accordion'; dayEl.id=`day-card-${dayData.day}`;
    let sectionsHTML='';
    dayData.sections.forEach((section,sIdx)=>{
      sectionsHTML+=`<div class="section-title">${section.name}</div>`;
      section.exercises.forEach((ex,eIdx)=>{
        const exId=`d${dayData.day}_s${sIdx}_e${eIdx}`;
        sectionsHTML+=`<label class="exercise-item" for="${exId}" data-ex="${ex.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}"><input type="checkbox" id="${exId}" onchange="onExerciseToggle(${dayData.day})"><span class="exercise-label">${ex}</span><span class="movement-icon">↗</span></label>`;
      });
    });
    const noteHTML=dayData.note?`<div class="day-note">${dayData.note}</div>`:'';
    dayEl.innerHTML=`<div class="day-header"><div class="day-title-container" onclick="toggleDay(${dayData.day})"><input type="checkbox" id="day-cb-${dayData.day}" onchange="toggleDayAll(event,${dayData.day})" onclick="event.stopPropagation()"><span class="day-title">${dayData.title}</span></div><div class="day-meta" onclick="toggleDay(${dayData.day})"><span class="day-counter" id="counter-day-${dayData.day}">0/${dayTotal}</span><span class="arrow">▼</span></div></div><div class="day-description">${dayData.description}</div><div class="day-content">${sectionsHTML}${noteHTML}</div>`;
    container.appendChild(dayEl);
    dayEl.querySelectorAll(".exercise-item").forEach(item=>item.addEventListener("click", function(event){ if(event.target.tagName !== "INPUT") openMovement(event, this.dataset.ex); }));
  });
  loadSavedState(); updateProgress();
}
const movementInfo = {
  "Cat-cow — 10 reps":["Start on hands and knees. Alternate rounding and extending the spine with your breath.","Keep the motion smooth and avoid forcing the neck or low back."],
  "90/90 hip switches — 10 total":["Sit with both knees bent and rotate the legs from side to side.","Stay tall and move from the hips."],
  "Deep squat hold — 2 × 45 sec":["Lower into a comfortable deep squat with feet planted and chest lifted.","Use support if needed; do not force the depth."],
  "Pigeon pose — 2 × 45 sec per side":["Place one shin forward and extend the opposite leg behind you, then hinge forward.","Keep the front knee comfortable."],
  "Frog stretch — 2 × 30 sec":["From hands and knees, widen the knees and gently shift the hips back.","Keep the stretch mild and controlled."],
  "Puppy pose — 2 × 30 sec":["Walk the hands forward from hands and knees and gently lower the chest.","Keep the shoulders comfortable."],
  "Thread the needle — 2 × 8 per side":["From hands and knees, slide one arm underneath the other and rotate the upper back.","Move slowly through a comfortable range."],
  "Dead bug — 2 × 8 per side":["Lie on your back with arms and knees raised and slowly extend opposite limbs.","Keep the low back controlled."],
  "Dead bugs — 2 × 8 per side":["Lie on your back with arms and knees raised and slowly extend opposite limbs.","Keep the low back controlled."],
  "Handstand — 2 × Fail":["Practice a controlled handstand with appropriate wall support if needed.","Prioritize safe exits and stop when form breaks down."],
  "Bridge pose — 2 × 5 reps, holding 5 sec":["Lie on your back, plant the feet, and lift the hips while keeping the knees tracking forward.","Avoid forcing the backbend."],
  "Sphinx pose — 2 × 30 sec":["Lie on your stomach and support the upper body on the forearms.","Create gentle extension without pinching the low back."],
  "Supported camel pose — 2 × 20 sec":["Kneel tall and gently extend through the upper back.","Use support instead of forcing the heels."],
  "Triangle pose — 30 sec per side":["Straighten the front leg, hinge the torso over it, and open the top arm.","Use a block if needed."],
  "Warrior II — 30 sec per side":["Take a wide stance, bend the front knee, and extend the arms.","Keep the front knee tracking over the foot."],
  "Child’s pose — 30 sec":["Sit the hips toward the heels and reach the arms forward.","Relax the neck and breathe slowly."],
  "Child’s pose — 1 min":["Sit the hips toward the heels and reach the arms forward.","Relax the neck and breathe slowly."],
  "Legs-up-the-wall — 2 min":["Lie on your back with your legs resting against a wall.","Let your breathing slow and keep the position comfortable."],
  "Diaphragmatic breathing — 2 min":["Breathe slowly into the lower ribs and abdomen.","Keep the shoulders relaxed and lengthen the exhale."],
};
function poseSVG(ex){
  var t=ex.toLowerCase(), pose="stand";
  if(t.indexOf("cat-cow")>=0) pose="cat"; else if(t.indexOf("plank")>=0||t.indexOf("push-up")>=0||t.indexOf("pushups")>=0) pose="plank"; else if(t.indexOf("bridge")>=0||t.indexOf("dead bug")>=0||t.indexOf("figure-four")>=0||t.indexOf("legs-up")>=0||t.indexOf("pelvic")>=0) pose="floor"; else if(t.indexOf("lunge")>=0||t.indexOf("warrior")>=0||t.indexOf("triangle")>=0||t.indexOf("half-split")>=0) pose="lunge"; else if(t.indexOf("squat")>=0||t.indexOf("chair")>=0) pose="squat"; else if(t.indexOf("pigeon")>=0||t.indexOf("frog")>=0||t.indexOf("child")>=0) pose="floor"; else if(t.indexOf("downward")>=0||t.indexOf("puppy")>=0||t.indexOf("cobra")>=0||t.indexOf("sphinx")>=0||t.indexOf("camel")>=0) pose="yoga"; else if(t.indexOf("balance")>=0||t.indexOf("half moon")>=0||t.indexOf("leg swing")>=0||t.indexOf("march")>=0) pose="balance";
  var body={
    stand:"<circle cx=\"250\" cy=\"52\" r=\"20\"/><line x1=\"250\" y1=\"72\" x2=\"250\" y2=\"145\"/><line x1=\"250\" y1=\"90\" x2=\"190\" y2=\"120\"/><line x1=\"250\" y1=\"90\" x2=\"310\" y2=\"120\"/><line x1=\"250\" y1=\"145\" x2=\"215\" y2=\"205\"/><line x1=\"250\" y1=\"145\" x2=\"285\" y2=\"205\"/>",
    squat:"<circle cx=\"250\" cy=\"52\" r=\"20\"/><line x1=\"250\" y1=\"72\" x2=\"250\" y2=\"130\"/><line x1=\"250\" y1=\"90\" x2=\"190\" y2=\"120\"/><line x1=\"250\" y1=\"90\" x2=\"310\" y2=\"120\"/><line x1=\"250\" y1=\"130\" x2=\"205\" y2=\"170\"/><line x1=\"205\" y1=\"170\" x2=\"180\" y2=\"205\"/><line x1=\"250\" y1=\"130\" x2=\"295\" y2=\"170\"/><line x1=\"295\" y1=\"170\" x2=\"325\" y2=\"205\"/>",
    lunge:"<circle cx=\"250\" cy=\"52\" r=\"20\"/><line x1=\"250\" y1=\"72\" x2=\"245\" y2=\"135\"/><line x1=\"245\" y1=\"92\" x2=\"190\" y2=\"120\"/><line x1=\"245\" y1=\"92\" x2=\"310\" y2=\"60\"/><line x1=\"245\" y1=\"135\" x2=\"205\" y2=\"175\"/><line x1=\"205\" y1=\"175\" x2=\"155\" y2=\"205\"/><line x1=\"245\" y1=\"135\" x2=\"300\" y2=\"165\"/><line x1=\"300\" y1=\"165\" x2=\"350\" y2=\"205\"/>",
    floor:"<circle cx=\"145\" cy=\"155\" r=\"20\"/><line x1=\"165\" y1=\"160\" x2=\"280\" y2=\"160\"/><line x1=\"215\" y1=\"160\" x2=\"180\" y2=\"205\"/><line x1=\"250\" y1=\"160\" x2=\"300\" y2=\"205\"/><line x1=\"205\" y1=\"160\" x2=\"180\" y2=\"120\"/><line x1=\"250\" y1=\"160\" x2=\"290\" y2=\"120\"/>",
    plank:"<circle cx=\"145\" cy=\"105\" r=\"20\"/><line x1=\"160\" y1=\"120\" x2=\"310\" y2=\"165\"/><line x1=\"205\" y1=\"135\" x2=\"170\" y2=\"205\"/><line x1=\"250\" y1=\"150\" x2=\"280\" y2=\"205\"/><line x1=\"205\" y1=\"135\" x2=\"160\" y2=\"145\"/><line x1=\"250\" y1=\"150\" x2=\"305\" y2=\"125\"/>",
    cat:"<circle cx=\"150\" cy=\"132\" r=\"18\"/><line x1=\"168\" y1=\"135\" x2=\"280\" y2=\"125\"/><line x1=\"280\" y1=\"125\" x2=\"365\" y2=\"150\"/><line x1=\"190\" y1=\"135\" x2=\"175\" y2=\"205\"/><line x1=\"275\" y1=\"128\" x2=\"270\" y2=\"205\"/><line x1=\"190\" y1=\"135\" x2=\"145\" y2=\"190\"/><line x1=\"315\" y1=\"140\" x2=\"350\" y2=\"195\"/>",
    yoga:"<circle cx=\"250\" cy=\"52\" r=\"20\"/><line x1=\"250\" y1=\"72\" x2=\"245\" y2=\"135\"/><line x1=\"245\" y1=\"95\" x2=\"190\" y2=\"120\"/><line x1=\"245\" y1=\"95\" x2=\"315\" y2=\"120\"/><line x1=\"245\" y1=\"135\" x2=\"190\" y2=\"185\"/><line x1=\"190\" y1=\"185\" x2=\"135\" y2=\"185\"/><line x1=\"245\" y1=\"135\" x2=\"315\" y2=\"170\"/><line x1=\"315\" y1=\"170\" x2=\"375\" y2=\"155\"/>",
    balance:"<circle cx=\"250\" cy=\"52\" r=\"20\"/><line x1=\"250\" y1=\"72\" x2=\"240\" y2=\"145\"/><line x1=\"240\" y1=\"95\" x2=\"180\" y2=\"70\"/><line x1=\"240\" y1=\"95\" x2=\"305\" y2=\"115\"/><line x1=\"240\" y1=\"145\" x2=\"195\" y2=\"195\"/><line x1=\"240\" y1=\"145\" x2=\"330\" y2=\"175\"/><line x1=\"330\" y1=\"175\" x2=\"390\" y2=\"155\"/>"
  };
  return "<svg viewBox=\"0 0 500 250\" aria-label=\"Movement preview\"><g fill=\"none\" stroke=\"#f8fafc\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\">"+(body[pose]||body.stand)+"</g><line x1=\"30\" y1=\"205\" x2=\"470\" y2=\"205\" stroke=\"#334155\" stroke-width=\"3\"/><text x=\"250\" y=\"235\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"13\">Movement preview</text></svg>";
}
function openMovement(event,ex){
  if(event.target && event.target.tagName==="INPUT") return;
  event.preventDefault();
  var info=movementInfo[ex]||["Follow the prescribed movement slowly and with control.","Stop for sharp pain, numbness, tingling, or pinching."];
  document.getElementById("movement-title").textContent=ex;
  document.getElementById("movement-description").textContent=info[0];
  document.getElementById("movement-tip").textContent=info[1];
  document.getElementById("movement-visual").innerHTML=poseSVG(ex);
  document.getElementById("movement-modal").classList.add("open");
}
function closeMovement(){document.getElementById("movement-modal").classList.remove("open");}
document.getElementById("movement-modal").addEventListener("click",closeMovement);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeMovement();});

function toggleDay(dayNum){document.getElementById(`day-card-${dayNum}`).classList.toggle('active');}
function toggleDayAll(event,dayNum){
  const isChecked=event.target.checked, dayData=workoutData.find(d=>d.day===dayNum);
  dayData.sections.forEach((section,sIdx)=>section.exercises.forEach((_,eIdx)=>{const cb=document.getElementById(`d${dayNum}_s${sIdx}_e${eIdx}`);if(cb)cb.checked=isChecked;}));
  updateProgress();
}
function onExerciseToggle(dayNum){
  const dayData=workoutData.find(d=>d.day===dayNum); let allChecked=true;
  dayData.sections.forEach((section,sIdx)=>section.exercises.forEach((_,eIdx)=>{const cb=document.getElementById(`d${dayNum}_s${sIdx}_e${eIdx}`);if(cb&&!cb.checked)allChecked=false;}));
  const dayCb=document.getElementById(`day-cb-${dayNum}`); if(dayCb)dayCb.checked=allChecked; updateProgress();
}
function updateProgress(){
  let grandTotalCompleted=0;
  workoutData.forEach(dayData=>{
    let dayCompleted=0,dayTotal=0;
    dayData.sections.forEach((section,sIdx)=>section.exercises.forEach((_,eIdx)=>{
      dayTotal++; const cb=document.getElementById(`d${dayData.day}_s${sIdx}_e${eIdx}`);
      if(cb&&cb.checked){dayCompleted++;grandTotalCompleted++;}
    }));
    const counterEl=document.getElementById(`counter-day-${dayData.day}`); if(counterEl)counterEl.textContent=`${dayCompleted}/${dayTotal}`;
    const dayCb=document.getElementById(`day-cb-${dayData.day}`); if(dayCb)dayCb.checked=dayCompleted===dayTotal&&dayTotal>0;
  });
  document.getElementById('total-progress').textContent=`${grandTotalCompleted} of ${globalExerciseCount} exercises complete`; saveState();
}
function saveState(){const state={};document.querySelectorAll('input[type="checkbox"]').forEach(cb=>state[cb.id]=cb.checked);localStorage.setItem('pitcher_mobility_state',JSON.stringify(state));}
function loadSavedState(){const saved=localStorage.getItem('pitcher_mobility_state');if(!saved)return;try{const state=JSON.parse(saved);Object.keys(state).forEach(id=>{const cb=document.getElementById(id);if(cb)cb.checked=state[id];});}catch(e){localStorage.removeItem('pitcher_mobility_state');}}
function resetAll(){if(confirm("Reset all exercise progress?")){document.querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.checked=false);updateProgress();}}
renderApp();
</script>
</body>
</html>
