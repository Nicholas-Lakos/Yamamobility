<script>function todayKey(){const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")}function pct(v){const m=String(v??"").match(/\d+(?:\.\d+)?/);return m?Math.max(0,Math.min(100,Math.round(Number(m[0])))):null}function ringColor(p,isRecovery){if(!isRecovery)return "#7faac7";return p>=67?"#22c55e":p>=34?"#ffd400":"#ef4444"}function loadReadiness(){let all={};try{all=JSON.parse(localStorage.getItem("yama_throwing_calendar")||"{}")}catch(e){}const rd=(all[todayKey()]||{}).readiness||{},sleep=pct(rd.sleep),recovery=pct(rd.recovery),nums=[rd.arm,rd.body,rd.energy].map(Number),sore=Number(rd.soreness),base=nums.every(Number.isFinite)&&Number.isFinite(sore)?Math.round((nums[0]*.35+(10-sore)*.30+nums[1]*.20+nums[2]*.15)*10):null,readiness=base===null?null:(recovery!==null?Math.round(base*.40+recovery*.60):base),wrap=document.getElementById("readinessRings");if(sleep===null&&recovery===null&&readiness===null){wrap.classList.add("empty");return}wrap.classList.remove("empty");[["readiness",readiness,true],["sleep",sleep,false],["recovery",recovery,true]].forEach(([id,p,isRec])=>{const ring=document.getElementById(id+"Ring"),val=document.getElementById(id+"Pct");if(p===null){ring.style.setProperty("--p",0);ring.style.setProperty("--ring","rgba(255,255,255,.25)");val.textContent="—"}else{ring.style.setProperty("--p",p);ring.style.setProperty("--ring",ringColor(p,isRec));val.textContent=p+"%"}})}function lockHomeViewport(){document.documentElement.scrollTop=0;document.body.scrollTop=0;window.scrollTo(0,0);document.documentElement.style.overflow="hidden";document.body.style.overflow="hidden"}window.addEventListener("pageshow",lockHomeViewport);window.addEventListener("load",()=>{lockHomeViewport();loadReadiness()});window.addEventListener("popstate",lockHomeViewport);document.addEventListener("visibilitychange",()=>{if(!document.hidden){lockHomeViewport();loadReadiness()}});</script><script src="enhancements.js?v=20260927-5"></script><script>function setHomeMode(m){localStorage.setItem("yama_mode",m);document.getElementById("home-mode").textContent=m.toUpperCase()+" MODE"}function cycleHomeMode(){const a=["Start Day","Bullpen","Recovery"],c=localStorage.getItem("yama_mode")||"Recovery";setHomeMode(a[(a.indexOf(c)+1)%a.length])}setHomeMode(localStorage.getItem("yama_mode")||"Recovery");if(sessionStorage.getItem("yama_splashed"))document.getElementById("splash").style.display="none";else sessionStorage.setItem("yama_splashed","1")</script></body>
