<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Yamamobility — Movements</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}.app{max-width:700px;margin:auto}.home{color:#38bdf8;text-decoration:none;font-weight:800}.head{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin:12px 0}.head h1{margin:0 0 5px}.head p{margin:0 0 12px;color:#94a3b8}.search{width:100%;padding:12px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:1rem}.item{background:#1e293b;border:1px solid #334155;border-radius:12px;margin:9px 0;padding:14px}.name{font-weight:800}.rx{color:#38bdf8;font-size:.85rem;margin-top:4px}.day{color:#94a3b8;font-size:.75rem;margin-top:5px}.item{cursor:pointer}.detail{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(3,9,20,.88)}.detail.open{display:flex}.detail-card{width:100%;max-width:650px;max-height:92vh;overflow:auto;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px}.detail-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.detail-close{border:1px solid #475569;background:#0f172a;color:#fff;border-radius:50%;width:34px;height:34px;font-size:1.2rem}.detail-img{margin-top:14px;background:#fff;border:1px solid #334155;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}.detail-img img{display:block;width:100%;height:auto;max-width:100%;max-height:520px;object-fit:contain;object-position:center;margin:0 auto;background:#fff}.no-image{padding:28px;color:#64748b;text-align:center}.routine{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;margin:12px 0}.routine-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.routine button,.add-btn{border:1px solid #38bdf8;background:#0f172a;color:#38bdf8;border-radius:8px;padding:9px 11px;font-weight:800}.routine-list{margin-top:9px;color:#cbd5e1;font-size:.85rem;line-height:1.7}.add-btn{width:100%;margin-top:12px;background:#38bdf8;color:#0f172a}.cr{position:fixed;inset:0;z-index:3000;display:none;background:#0f172a;padding:14px;overflow:auto}.cr.open{display:block}.cr-card{max-width:650px;margin:auto;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px}.cr-img{margin:14px 0;background:#fff;border-radius:12px;overflow:hidden}.cr-img img{display:block;width:100%;max-height:50vh;object-fit:contain}.cr-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cr-actions button{padding:12px;border:1px solid #38bdf8;border-radius:9px;background:#0f172a;color:#fff;font-weight:800}</style></head><body><main class="app"><a class="home" href="dashboard.html">← DASHBOARD</a><section class="routine"><div class="routine-head"><div><b>My Routine</b><div class="day" id="routineCount">0 exercises</div></div><button onclick="startRoutine()">START</button></div><div class="routine-list" id="routineList">Add exercises from the library below.</div></section><section class="head"><h1>Movement Library</h1><p>Search every Yamamobility mobility and control exercise.</p><input class="search" id="q" placeholder="Search movements..." oninput="draw()"></section><div id="list"></div></main><div class="detail" id="detail" onclick="closeDetail()"><div class="detail-card" onclick="event.stopPropagation()"><div class="detail-head"><div><div class="name" id="detailName"></div><div class="rx" id="detailRx"></div><div class="day" id="detailDay"></div></div><button class="detail-close" onclick="closeDetail()">×</button></div><div class="detail-img" id="detailImg"></div><button class="add-btn" id="addBtn" onclick="toggleRoutine()">+ ADD TO MY ROUTINE</button></div></div><div class="cr" id="cr"><div class="cr-card"><div class="routine-head"><div><div class="day" id="crStep"></div><h2 id="crName" style="margin:5px 0"></h2><div class="rx" id="crRx"></div></div><button onclick="endRoutine()">×</button></div><div class="cr-img" id="crImg"></div><div class="cr-actions"><button id="crBack" onclick="crPrev()">← BACK</button><button onclick="crNext()">COMPLETE →</button></div></div></div><script>
const days=[["Day 1",["Cat-cow — 10 reps","Leg swings, front to back — 10 per leg","90/90 hip switches — 10 total","World’s greatest stretch — 5 per side","90/90 hip stretch — 2 × 45 sec per side","Deep squat hold — 2 × 45 sec","Low lunge with overhead reach — 2 × 30 sec per side","Half-kneeling hip-flexor stretch — 2 × 45 sec per side","Adductor rock-backs — 2 × 10 per side","Pigeon pose — 2 × 45 sec per side","Seated forward fold — 2 × 45 sec","Frog stretch — 2 × 30 sec","Wall Knee Walks — 2 × 8","Single-leg glute bridge — 2 × 10 per side","Single-leg balance with reach — 2 × 5 per side","Half Moon — 2 × 30 sec per side","Handstand — 2 × Fail","Diaphragmatic breathing — 2 min"]],["Day 2",["Arm circles — 10 each direction","Scapular push-ups — 10 reps","Cat-cow — 10 reps","Thoracic rotations — 8 per side","Thread the needle — 2 × 8 per side","Wall slides — 2 × 10","Puppy pose — 2 × 30 sec","Doorway chest stretch — 2 × 30 sec per side","Quadruped thoracic rotations — 2 × 8 per side","Puppy pose — 2 × 30–45 sec","Cow-face arms — 2 × 20–30 sec per side","Thread the needle — 2 × 30 sec per side","1 Foot Handstand Push-ups — 2 × 5 per side","Crab Touches — 2 × 3","Hand Walk Arounds — 2 × 5 per side","Dead bug — 2 × 8 per side","1 Hand Plank Reach-Through — 2 × 5 per side","Diaphragmatic breathing — 2 min"]],["Day 3",["Cat-cow — 10 reps","Pelvic tilts — 10 reps","AAROM Thoracic rotations — 8 per side","Downward dog to plank — 8 reps","Child’s pose with side reach — 2 × 30 sec per side","Sphinx pose — 2 × 30 sec","Open-book rotations — 2 × 8 per side","Seated spinal rotations — 2 × 8 per side","Sphinx pose — 2 × 30–45 sec","Low cobra — 2 × 8 reps, holding 5 sec","Bridge pose — 2 × 5 reps, holding 5 sec","Supported camel pose — 2 × 20 sec","Half-split stretch — 2 × 45 sec per side","Sumo Squat with OVH Reach — 2 × 10","Lying Hip over Shoulders with Rocker Reach — 2 × 45 sec","Low lunge — 1 × 45 sec per side","Supine figure-four stretch — 1 × 45 sec per side","Diaphragmatic breathing — 2 min"]],["Day 4",["March in place — 1 min","Arm swings — 10 each direction","Leg swings — 10 per leg","Cat-cow — 8 reps","Single-leg balance with leg hold — 2 × 20 sec per leg","Downward dog — 30 sec","Low lunge with rotation — 5 per side","Warrior II — 30 sec per side","Triangle pose — 30 sec per side","Chair pose — 30 sec","Single-leg balance with reach — 2 × 5 per side","Bird dogs — 2 × 8 per side","Dead bugs — 2 × 8 per side","Plank Foot Crossover Reaches — 2 × 5 per side","1-Sided Crab Holds — 2 × 30 sec per side","Legs-up-the-wall — 2 min","Child’s pose — 1 min","Diaphragmatic breathing — 2 min"]]];
const images={
"Cat-cow":"assets/cat-cow.jpg?v=20260927-new17","Leg swings, front to back":"assets/leg-swings.jpg?v=20260927-new17","Leg swings":"assets/leg-swings.jpg?v=20260927-new17","90/90 hip switches":"assets/90-90-hip-switches.jpg?v=20260927-new17","World’s greatest stretch":"assets/worlds-greatest-stretch.jpg?v=20260927-new17","90/90 hip stretch":"assets/90-90-hip-stretch.jpg?v=20260927-new17","Deep squat hold":"assets/deep-squat-hold.jpg?v=20260927-new17","Low lunge with overhead reach":"assets/low-lunge-overhead-reach.jpg?v=20260927-new17","Half-kneeling hip-flexor stretch":"assets/half-kneeling-hip-flexor-stretch.jpg?v=20260927-new17","Adductor rock-backs":"assets/adductor-rock-backs.jpg?v=20260927-new17","Pigeon pose":"assets/pigeon-pose.jpg?v=20260927-new17","Seated forward fold":"assets/seated-forward-fold.jpg?v=20260927-new17","Frog stretch":"assets/frog-stretch.jpg?v=20260927-new17","Wall Knee Walks":"assets/wall-knee-walks.jpg?v=20260927-new17","Single-leg glute bridge":"assets/single-leg-glute-bridge.jpg?v=20260927-new17","Single-leg balance with reach":"assets/single-leg-balance-reach.jpg?v=20260927-new17","Half Moon":"assets/half-moon.jpg?v=20260927-new17","Handstand":"assets/handstand.jpg?v=20260927-new17","Arm circles":"assets/yamamobility_day2_images/Arm Circles.png?v=day2-20260927","Scapular push-ups":"assets/yamamobility_day2_images/Scap Push-Ups.jpg?v=day2-20260927","Thoracic rotations":"assets/yamamobility_day2_images/Thoracic Rotation.jpg?v=day2-20260927","Thread the needle":"assets/yamamobility_day2_images/Thread the Needle.jpg?v=day2-20260927","Wall slides":"assets/yamamobility_day2_images/Wall Slides.jpg?v=day2-20260927","Puppy pose":"assets/yamamobility_day2_images/Puppy Pose.jpg?v=day2-20260927","Doorway chest stretch":"assets/yamamobility_day2_images/Doorway Stretch.jpg?v=day2-20260927","Quadruped thoracic rotations":"assets/yamamobility_day2_images/Quadruped Thoracic Rotation.png?v=day2-20260927","Cow-face arms":"assets/yamamobility_day2_images/Cow-Face Arms.jpg?v=day2-20260927","1 Foot Handstand Push-ups":"assets/yamamobility_day2_images/1 Foot Handstand Push-ups.jpg?v=day2-20260927","Crab Touches":"assets/yamamobility_day2_images/Crab Touches.jpg?v=day2-20260927","Hand Walk Arounds":"assets/yamamobility_day2_images/Hand Walk Arounds.avif?v=day2-20260927","Dead bug":"assets/yamamobility_day2_images/Dead Bug.webp?v=day2-20260927","1 Hand Plank Reach-Through":"assets/yamamobility_day2_images/1 Hand Plank Reach-Through.webp?v=day2-20260927","Diaphragmatic breathing":"assets/Yama Celly.gif?v=yama-celly-gif-20260927"};
let currentDetail="";let routine=JSON.parse(localStorage.getItem("yama_custom_routine")||"[]");let crPos=0;
function saveRoutine(){localStorage.setItem("yama_custom_routine",JSON.stringify(routine));drawRoutine()}
function drawRoutine(){routineCount.textContent=routine.length+" exercise"+(routine.length===1?"":"s");routineList.innerHTML=routine.length?routine.map((n,i)=>'<div>'+n+' <button style="float:right;background:none;border:0;color:#ef4444" onclick="event.stopPropagation();routine.splice('+i+',1);saveRoutine()">REMOVE</button></div>').join(""):"Add exercises from the library below."}
function toggleRoutine(){if(!currentDetail)return;const i=routine.indexOf(currentDetail);if(i>=0)routine.splice(i,1);else routine.push(currentDetail);saveRoutine();addBtn.textContent=routine.includes(currentDetail)?"REMOVE FROM MY ROUTINE":"+ ADD TO MY ROUTINE"}
function startRoutine(){if(!routine.length){alert("Add at least one exercise first.");return}crPos=0;cr.classList.add("open");showCR()}
function showCR(){const name=routine[crPos],x=all.find(y=>y.name===name);crStep.textContent=(crPos+1)+" / "+routine.length;crName.textContent=name;crRx.textContent=x?x.rx:"";const src=images[name];crImg.innerHTML=src?'<img src="'+src+'" alt="">':'<div class="no-image">Image not added yet.</div>';crBack.disabled=crPos===0}
function crPrev(){if(crPos>0){crPos--;showCR()}}function crNext(){if(crPos<routine.length-1){crPos++;showCR()}else endRoutine()}function endRoutine(){cr.classList.remove("open")}
const all=[];days.forEach(([day,xs])=>xs.forEach(x=>{const p=x.split(/\s+[—–-]\s+/,2);if(!all.some(y=>y.name===p[0]))all.push({name:p[0],rx:p[1]||"",day})}));all.sort((a,b)=>a.name.localeCompare(b.name));function draw(){const q=document.getElementById("q").value.toLowerCase();document.getElementById("list").innerHTML=all.filter(x=>x.name.toLowerCase().includes(q)).map(x=>'<div class="item" onclick="openDetail(\''+x.name.replace(/'/g,"\\'")+'\')"><div class="name">'+x.name+'</div><div class="rx">'+x.rx+'</div><div class="day">'+x.day+'</div></div>').join("")}function openDetail(name){const x=all.find(y=>y.name===name);if(!x)return;currentDetail=name;addBtn.textContent=routine.includes(name)?"REMOVE FROM MY ROUTINE":"+ ADD TO MY ROUTINE";detailName.textContent=x.name;detailRx.textContent=x.rx;detailDay.textContent=x.day;const src=images[x.name];detailImg.innerHTML=src?'<img src="'+src+'" alt="'+x.name.replace(/"/g,"&quot;")+'">':'<div class="no-image">Image not added yet.</div>';detail.classList.add("open")}function closeDetail(){detail.classList.remove("open")}document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDetail()});const params=new URLSearchParams(location.search);if(params.get("q")){q.value=params.get("q");draw();const exact=all.find(x=>x.name.toLowerCase()===params.get("q").toLowerCase());if(exact)openDetail(exact.name)}draw();drawRoutine();</script></body></html>
