<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Yamamobility — Movements</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}.app{max-width:700px;margin:auto}.home{color:#38bdf8;text-decoration:none;font-weight:800}.head{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin:12px 0}.head h1{margin:0 0 5px}.head p{margin:0 0 12px;color:#94a3b8}.search{width:100%;padding:12px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:1rem}.item{background:#1e293b;border:1px solid #334155;border-radius:12px;margin:9px 0;padding:14px}.name{font-weight:800}.rx{color:#38bdf8;font-size:.85rem;margin-top:4px}.day{color:#94a3b8;font-size:.75rem;margin-top:5px}</style></head><body><main class="app"><a class="home" href="index.html">← HOME</a><section class="head"><h1>Movement Library</h1><p>Search every Yamamobility mobility and control exercise.</p><input class="search" id="q" placeholder="Search movements..." oninput="draw()"></section><div id="list"></div></main><script>
const days=[["Day 1",["Cat-cow — 10 reps","Leg swings, front to back — 10 per leg","90/90 hip switches — 10 total","World’s greatest stretch — 5 per side","90/90 hip stretch — 2 × 45 sec per side","Deep squat hold — 2 × 45 sec","Low lunge with overhead reach — 2 × 30 sec per side","Half-kneeling hip-flexor stretch — 2 × 45 sec per side","Adductor rock-backs — 2 × 10 per side","Pigeon pose — 2 × 45 sec per side","Seated forward fold — 2 × 45 sec","Frog stretch — 2 × 30 sec","Wall Knee Walks — 2 × 8","Single-leg glute bridge — 2 × 10 per side","Single-leg balance with reach — 2 × 5 per side","Half Moon — 2 × 30 sec per side","Handstand — 2 × Fail","Diaphragmatic breathing — 2 min"]],["Day 2",["Arm circles — 10 each direction","Scapular push-ups — 10 reps","Cat-cow — 10 reps","Thoracic rotations — 8 per side","Thread the needle — 2 × 8 per side","Wall slides — 2 × 10","Puppy pose — 2 × 30 sec","Doorway chest stretch — 2 × 30 sec per side","Quadruped thoracic rotations — 2 × 8 per side","Puppy pose — 2 × 30–45 sec","Cow-face arms — 2 × 20–30 sec per side","Thread the needle — 2 × 30 sec per side","1 Foot Handstand Push-ups — 2 × 5 per side","Crab Touches — 2 × 3","Hand Walk Arounds — 2 × 5 per side","Dead bug — 2 × 8 per side","1 Hand Plank Reach-Through — 2 × 5 per side","Diaphragmatic breathing — 2 min"]],["Day 3",["Cat-cow — 10 reps","Pelvic tilts — 10 reps","AAROM Thoracic rotations — 8 per side","Downward dog to plank — 8 reps","Child’s pose with side reach — 2 × 30 sec per side","Sphinx pose — 2 × 30 sec","Open-book rotations — 2 × 8 per side","Seated spinal rotations — 2 × 8 per side","Sphinx pose — 2 × 30–45 sec","Low cobra — 2 × 8 reps, holding 5 sec","Bridge pose — 2 × 5 reps, holding 5 sec","Supported camel pose — 2 × 20 sec","Half-split stretch — 2 × 45 sec per side","Sumo Squat with OVH Reach — 2 × 10","Lying Hip over Shoulders with Rocker Reach — 2 × 45 sec","Low lunge — 1 × 45 sec per side","Supine figure-four stretch — 1 × 45 sec per side","Diaphragmatic breathing — 2 min"]],["Day 4",["March in place — 1 min","Arm swings — 10 each direction","Leg swings — 10 per leg","Cat-cow — 8 reps","Single-leg balance with leg hold — 2 × 20 sec per leg","Downward dog — 30 sec","Low lunge with rotation — 5 per side","Warrior II — 30 sec per side","Triangle pose — 30 sec per side","Chair pose — 30 sec","Single-leg balance with reach — 2 × 5 per side","Bird dogs — 2 × 8 per side","Dead bugs — 2 × 8 per side","Plank Foot Crossover Reaches — 2 × 5 per side","1-Sided Crab Holds — 2 × 30 sec per side","Legs-up-the-wall — 2 min","Child’s pose — 1 min","Diaphragmatic breathing — 2 min"]]];
const all=[];days.forEach(([day,xs])=>xs.forEach(x=>{const p=x.split(/\s+[—–-]\s+/,2);if(!all.some(y=>y.name===p[0]))all.push({name:p[0],rx:p[1]||"",day})}));all.sort((a,b)=>a.name.localeCompare(b.name));function draw(){const q=document.getElementById("q").value.toLowerCase();document.getElementById("list").innerHTML=all.filter(x=>x.name.toLowerCase().includes(q)).map(x=>'<div class="item"><div class="name">'+x.name+'</div><div class="rx">'+x.rx+'</div><div class="day">'+x.day+'</div></div>').join("")}draw();</script></body></html>
