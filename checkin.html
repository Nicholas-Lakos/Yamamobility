<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030914"><link rel="manifest" href="manifest.webmanifest"><title>Yamamobility Check-In</title><style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}.wrap{max-width:650px;margin:auto}.back{color:#38bdf8;text-decoration:none;font-weight:800}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin:14px 0}h1{margin-bottom:4px}.muted{color:#94a3b8;font-size:.85rem}.scale-label{display:flex;justify-content:space-between;gap:8px;margin-top:18px;font-weight:900}.scale-label output{color:#38bdf8}.scale-hint{display:flex;justify-content:space-between;color:#64748b;font-size:.68rem;margin-top:3px}input[type=range]{width:100%;accent-color:#38bdf8;margin:10px 0 0;height:30px}label.text{display:block;margin:16px 0 6px;color:#cbd5e1;font-weight:800}input[type=text]{width:100%;padding:12px;border:1px solid #475569;border-radius:9px;background:#0f172a;color:#fff;font-size:1rem}.save{width:100%;margin-top:18px;padding:13px;border:1px solid #38bdf8;border-radius:10px;background:#38bdf8;color:#0f172a;font-size:1rem;font-weight:900}.saved{display:none;margin-top:12px;padding:10px;border-radius:9px;background:#0c315f;color:#fff;text-align:center;font-weight:800}.saved.show{display:block}</style></head><body><div class="wrap"><a class="back" href="index.html">← HOME</a><h1>Daily Check-In</h1><p class="muted" id="dateLabel"></p><div class="card"><p class="muted">Rate how you feel today. 1 = poor / very sore, 10 = excellent / fresh.</p><div class="scale-label"><span>Arm</span><output id="armOut">5</output></div><input id="arm" type="range" min="1" max="10" value="5"><div class="scale-hint"><span>Sore / fatigued</span><span>Fresh</span></div><div class="scale-label"><span>Body</span><output id="bodyOut">5</output></div><input id="body" type="range" min="1" max="10" value="5"><div class="scale-hint"><span>Sore / fatigued</span><span>Fresh</span></div><div class="scale-label"><span>Energy</span><output id="energyOut">5</output></div><input id="energy" type="range" min="1" max="10" value="5"><div class="scale-hint"><span>Low</span><span>High</span></div><div class="scale-label"><span>Soreness</span><output id="sorenessOut">5</output></div><input id="soreness" type="range" min="1" max="10" value="5"><div class="scale-hint"><span>Very sore</span><span>No soreness</span></div><label class="text" for="recovery">Recovery</label><input id="recovery" type="text" placeholder="Example: 82%"><label class="text" for="sleep">Sleep</label><input id="sleep" type="text" placeholder="Example: 91% or Good"><label class="text" for="sleepTime">Sleep Time</label><input id="sleepTime" type="text" placeholder="Example: 8h 12m"><button class="save" id="save">SAVE CHECK-IN</button><div class="saved" id="saved">CHECK-IN SAVED ✓</div></div></div><script>const KEY="yama_throwing_calendar";const now=new Date(),key=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");dateLabel.textContent=now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});function data(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}}const fields=["arm","body","energy","soreness"];fields.forEach(id=>{const el=document.getElementById(id),out=document.getElementById(id+"Out");el.addEventListener("input",()=>out.textContent=el.value)});const d=data(),x=d[key]||{},r=x.readiness||{};fields.forEach(id=>{if(r[id]!=null&&!isNaN(Number(r[id]))){document.getElementById(id).value=r[id];document.getElementById(id+"Out").textContent=r[id]}});recovery.value=r.recovery||"";sleep.value=r.sleep||"";sleepTime.value=r.sleepTime||"";save.onclick=()=>{const all=data(),old=all[key]||{};all[key]={...old,readiness:{...(old.readiness||{}),arm:Number(arm.value),body:Number(body.value),energy:Number(energy.value),soreness:Number(soreness.value),recovery:recovery.value.trim(),sleep:sleep.value.trim(),sleepTime:sleepTime.value.trim()}};localStorage.setItem(KEY,JSON.stringify(all));saved.classList.add("show");setTimeout(()=>saved.classList.remove("show"),1800)}</script></body></html>
