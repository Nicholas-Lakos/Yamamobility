<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Yamamobility — Flecha</title>
<style>:root{--bg-color:#0f172a;--card-bg:#1e293b;--card-border:#334155;--text-main:#f8fafc;--text-muted:#94a3b8;--accent-blue:#38bdf8;--accent-green:#22c55e;--active-item-bg:rgba(34,197,94,.12)}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}body{background:var(--bg-color);color:var(--text-main);padding:12px;display:flex;justify-content:center}.app-container{width:100%;max-width:650px}header{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:16px;margin-bottom:16px}h1{font-size:1.35rem;margin-bottom:4px}.subtitle{font-size:.85rem;color:var(--text-muted);margin-bottom:14px;line-height:1.3}.main-progress{background:#0f172a;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--card-border)}.progress-text{font-size:.9rem;font-weight:600;color:var(--accent-blue)}.btn-reset{background:transparent;border:1px solid #ef4444;color:#ef4444;padding:6px 12px;border-radius:6px;font-size:.8rem;font-weight:600}.day-accordion{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;margin-bottom:12px;overflow:hidden}.day-header{width:100%;background:none;border:0;padding:14px 16px;text-align:left;color:var(--text-main);display:flex;justify-content:space-between;align-items:center}.day-title-container{display:flex;align-items:center;gap:12px;flex-grow:1}.day-title{font-size:1rem;font-weight:600;line-height:1.2}.day-counter{font-size:.85rem;font-weight:600;color:var(--accent-blue);white-space:nowrap}.arrow{font-size:.75rem;color:var(--text-muted);margin-left:10px;transition:.3s}.day-accordion.active .arrow{transform:rotate(180deg)}.day-description{padding:0 16px 12px;font-size:.8rem;color:var(--text-muted);border-bottom:1px solid var(--card-border);line-height:1.35}.day-content{max-height:0;overflow:hidden;transition:max-height .3s;background:#111827}.day-accordion.active .day-content{max-height:1800px}.section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-blue);padding:10px 16px 4px;background:#172033;border-top:1px solid var(--card-border);font-weight:700}.exercise-item{display:flex;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #1f2937;cursor:pointer}.exercise-item input{appearance:none;width:22px;height:22px;border:2px solid var(--text-muted);border-radius:6px;margin-right:14px;flex-shrink:0}.exercise-item input:checked{background:var(--accent-green);border-color:var(--accent-green)}.exercise-item input:checked:after{content:'✓';color:white;font-size:15px;font-weight:bold;position:relative;left:4px;top:-2px}.exercise-item:has(input:checked){background:var(--active-item-bg)}.exercise-label{display:flex;flex-direction:column;gap:4px;line-height:1.3}.exercise-name{font-size:.92rem;font-weight:600}.exercise-prescription,.cue{font-size:.78rem;color:var(--text-muted)}.cue{margin-top:4px;line-height:1.4}.home{display:inline-block;color:var(--accent-blue);text-decoration:none;font-size:.85rem;font-weight:700;margin-bottom:10px}.video-button{margin-left:10px;border:1px solid var(--accent-blue);background:transparent;color:var(--accent-blue);border-radius:7px;padding:6px 9px;font-size:.72rem;font-weight:700;cursor:pointer;flex-shrink:0}.video-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:10px;background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}.video-modal.open{display:flex}.video-card{width:100%;max-width:620px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;overflow:hidden}.video-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}.video-title{font-weight:700}.video-close{border:1px solid var(--card-border);background:transparent;color:white;width:34px;height:34px;border-radius:50%;font-size:1.2rem}.video-card video{display:block;width:100%;max-height:72vh;background:#000}</style></head>
<body><div class="app-container"><header><a class="home" href="index.html">← HOME</a><h1>Flecha Throwing</h1><div class="subtitle">3-Day Pitcher Throwing Sequence — intensity, momentum, touch & mechanical consistency</div><div class="main-progress"><span class="progress-text" id="progress">0 of 10 exercises complete</span><button class="btn-reset" onclick="resetAll()">Reset</button></div></header><div id="routine"></div><div class="video-modal" id="video-modal" onclick="closeVideo()"><div class="video-card" onclick="event.stopPropagation()"><div class="video-head"><div class="video-title" id="video-title">Demo</div><button class="video-close" onclick="closeVideo()">×</button></div><video id="demo-video" controls muted playsinline disablepictureinpicture controlslist="nodownload noplaybackrate"></video></div></div></div>
<script>
const exerciseVideos={
"Abbreviated / Rocker Throws":"assets/Abbreviated Rocker.mov",
"Full Standing Distance Throws":"assets/Full Throw:Crow Hop.MOV",
"Crow-Hop Max Velocity Throws":"assets/Full Throw:Crow Hop.MOV",
"Rocker Throws":"assets/Rocker Throw.mov"
};
function openVideo(name){const src=exerciseVideos[name];if(!src)return;document.getElementById("video-title").textContent=name;const v=document.getElementById("demo-video");v.src=src+"?v=20260927-clips";v.muted=true;v.volume=0;document.getElementById("video-modal").classList.add("open");v.play().catch(()=>{})}
function closeVideo(){const v=document.getElementById("demo-video");v.pause();v.removeAttribute("src");v.load();document.getElementById("video-modal").classList.remove("open")}
const days=[
{title:"MONDAY — High Intensity & Sequence Loading",description:"Primary throwing day. Focus on generating maximum rotational force from your lower half and delaying your arm.",ex:[
["Warm-up Flips","5 reps · 15–20 feet","Stand tall, isolate your wrist/forearm, and flip the Flecha cleanly into a net or turf. Ensure the nose does not dip."],
["Kneeling / Half-Kneeling Throws","5 reps","Keep your lower body pinned. Rotate your chest away, pull cleanly through your chest, and let the Flecha whip through late."],
["Abbreviated / Rocker Throws","4 reps","Start with your front leg planted. Rock your weight onto your back hip, drive the pelvis open, and delay the arm until the absolute last millisecond."],
["Full Standing Distance Throws","5 reps · 90–150+ feet","Throw for distance over grass. Try to get a high, clean trajectory without letting the javelin wobble or flutter."]]},
{title:"WEDNESDAY — Momentum & Speed Transfer",description:"Use footwork to carry linear speed into your throw, simulating the momentum you generate out of a baseball windup or stretch.",ex:[
["Walking / Dynamic Flips","5 reps","Take smooth, slow walking steps forward and release the Flecha with perfect horizontal stability."],
["One-Step / Step-Behind Throws","5 reps","Step your back foot behind your lead foot (like an outfield crow-hop), plant hard on a stiff front leg, and transfer that energy up through your torso."],
["Crow-Hop Max Velocity Throws","3 reps","Take 2–3 aggressive running steps on a line. Explode through the release point while maintaining a pristine, out-front baseball release."]]},
{title:"FRIDAY — Touch, Feel & Mechanical Consistency",description:"Low-volume, high-focus day designed to lock in your release point before weekend bullpens or games.",ex:[
["Target Flips","5 reps · 20 feet","Pick a literal brick or specific square on a net. Throw with zero wobble and 100% precision."],
["Rocker Throws","4 reps · 60–70% effort","Smooth, easy tempo. Do not push the throw with your hand; focus entirely on the feeling of your chest pulling the arm through."],
["Baseball-to-Flecha Mapping","2 alternating sets × 3 reps","Throw 3 reps with the Flecha, immediately pick up a standard 5 oz baseball, and mimic the exact same body-driven feeling for 3 throws into a net."]]}];
function render(){document.getElementById("routine").innerHTML=days.map((d,di)=>`<section class="day-accordion active"><button class="day-header" onclick="this.parentElement.classList.toggle('active')"><span class="day-title-container"><span class="day-title">${d.title}</span></span><span class="day-counter" id="c${di}">0/${d.ex.length}</span><span class="arrow">▼</span></button><div class="day-description">${d.description}</div><div class="day-content"><div class="section-title">Throwing Sequence</div>${d.ex.map((e,ei)=>`<label class="exercise-item"><input type="checkbox" id="f${di}_${ei}" onchange="save()"><span class="exercise-label"><span class="exercise-name">${e[0]}</span><span class="exercise-prescription">${e[1]}</span><span class="cue"><b>Cue:</b> ${e[2]}</span></span>${exerciseVideos[e[0]]?`<button type="button" class="video-button" onclick="event.preventDefault();event.stopPropagation();openVideo(\`${e[0]}\`)">VIDEO</button>`:""}</label>`).join("")}</div></section>`).join("");load()}
function save(){let n=0,total=0;days.forEach((d,di)=>{let c=0;d.ex.forEach((e,ei)=>{total++;let x=document.getElementById(`f${di}_${ei}`);localStorage.setItem(`flecha_${di}_${ei}`,x.checked);if(x.checked){c++;n++}});document.getElementById(`c${di}`).textContent=`${c}/${d.ex.length}`});document.getElementById("progress").textContent=`${n} of ${total} exercises complete`}
function load(){days.forEach((d,di)=>d.ex.forEach((e,ei)=>document.getElementById(`f${di}_${ei}`).checked=localStorage.getItem(`flecha_${di}_${ei}`)==="true"));save()}
function resetAll(){days.forEach((d,di)=>d.ex.forEach((e,ei)=>{localStorage.removeItem(`flecha_${di}_${ei}`);document.getElementById(`f${di}_${ei}`).checked=false}));save()}render();
</script></body></html>
